openapi: 3.0.3
info:
  title: Review Service API
  description: Customer reviews and ratings for the e-commerce platform. Read operations on approved reviews are public; write operations require JWT authentication; moderation requires ADMIN role.
  version: 1.0.0
  contact:
    name: Platform Team

servers:
  - url: http://localhost:8086
    description: Local development
  - url: http://api-gateway:8080
    description: Via API Gateway

tags:
  - name: Reviews
    description: Customer review submission and retrieval
  - name: Review Admin
    description: Review moderation (ADMIN only)

security:
  - bearerAuth: []

paths:
  /api/v1/products/{productId}/reviews:
    get:
      tags: [Reviews]
      operationId: listProductReviews
      summary: List approved reviews for a product
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated approved reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReviews"

  /api/v1/products/{productId}/reviews/summary:
    get:
      tags: [Reviews]
      operationId: getProductReviewSummary
      summary: Get rating summary for a product
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Average rating, total count and distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"

  /api/v1/reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Submit a review (one per user per product)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review created (PENDING moderation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "409":
          description: User already reviewed this product

  /api/v1/reviews/my:
    get:
      tags: [Reviews]
      operationId: listMyReviews
      summary: List the authenticated user's reviews
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated user reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReviews"

  /api/v1/reviews/{id}:
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Get a single review by id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Review not found
    put:
      tags: [Reviews]
      operationId: updateReview
      summary: Update own review (resets status to PENDING)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Review not found or not owned by caller
    delete:
      tags: [Reviews]
      operationId: deleteReview
      summary: Delete own review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Review deleted
        "404":
          description: Review not found or not owned by caller

  /api/v1/admin/reviews:
    get:
      tags: [Review Admin]
      operationId: listReviewsForModeration
      summary: List reviews filtered by moderation status
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReviews"
        "400":
          description: Invalid status value
        "403":
          description: ADMIN role required

  /api/v1/admin/reviews/{id}/approve:
    post:
      tags: [Review Admin]
      operationId: approveReview
      summary: Approve a review (publishes review.created event)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Approved review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /api/v1/admin/reviews/{id}/reject:
    post:
      tags: [Review Admin]
      operationId: rejectReview
      summary: Reject a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Rejected review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ReviewRequest:
      type: object
      required: [productId, rating]
      properties:
        productId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 160
        body:
          type: string
          maxLength: 5000

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        rating:
          type: integer
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        verifiedPurchase:
          type: boolean
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewSummary:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        averageRating:
          type: number
          format: double
        totalReviews:
          type: integer
          format: int64
        ratingDistribution:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example: { "5": 12, "4": 5, "3": 1 }

    PaginatedReviews:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        last:
          type: boolean
