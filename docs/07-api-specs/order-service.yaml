openapi: 3.0.3
info:
  title: Order Management API
  description: >
    Existing order-management-api service. Endpoints captured from the live
    Spring Boot controllers (OrderController, CustomerController). This spec
    reflects the REAL code, not the SDLC plan stubs.
  version: 1.0.0
  contact:
    name: Platform Team

servers:
  - url: http://localhost:8084
    description: Local development
  - url: http://api-gateway:8080
    description: Via API Gateway

tags:
  - name: Orders
    description: Order placement, retrieval, patching, and deletion
  - name: Customers
    description: Customer CRUD

paths:
  # ─── Orders ────────────────────────────────────────────────────────
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order
      description: >
        Deducts stock, creates the order, and charges the payment in one
        transaction. Idempotent when an Idempotency-Key header is sent.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional idempotency key to prevent duplicate order creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              customerId: 1
              items:
                - productId: 10
                  quantity: 2
                - productId: 25
                  quantity: 1
      responses:
        '201':
          description: Order created
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/orders/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: 42
                orderNumber: "ORD-20260910-00042"
                orderDate: "2026-09-10T14:30:00"
                status: PLACED
                totalAmount: 69.97
                customerEmail: "jane.doe@example.com"
                items:
                  - id: 1
                    productId: 10
                    productName: "Wireless Mouse"
                    quantity: 2
                    unitPrice: 29.99
                    totalPrice: 59.98
                  - id: 2
                    productId: 25
                    productName: "USB-C Cable"
                    quantity: 1
                    unitPrice: 9.99
                    totalPrice: 9.99
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders with pagination
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          schema:
            type: string
          example: "orderDate,desc"
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrderResponse'
              example:
                content:
                  - id: 42
                    orderNumber: "ORD-20260910-00042"
                    orderDate: "2026-09-10T14:30:00"
                    status: PLACED
                    totalAmount: 69.97
                    customerEmail: "jane.doe@example.com"
                    items: []
                totalElements: 1
                totalPages: 1
                size: 20
                number: 0

  /api/v1/orders/bulk:
    post:
      tags: [Orders]
      operationId: createBulkOrders
      summary: Place multiple orders at once
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderRequest'
            example:
              - customerId: 1
                items:
                  - productId: 10
                    quantity: 2
              - customerId: 2
                items:
                  - productId: 25
                    quantity: 3
      responses:
        '201':
          description: Bulk orders created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order found
          headers:
            ETag:
              schema:
                type: string
              example: '"v1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: 42
                orderNumber: "ORD-20260910-00042"
                orderDate: "2026-09-10T14:30:00"
                status: PLACED
                totalAmount: 69.97
                customerEmail: "jane.doe@example.com"
                items:
                  - id: 1
                    productId: 10
                    productName: "Wireless Mouse"
                    quantity: 2
                    unitPrice: 29.99
                    totalPrice: 59.98
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Orders]
      operationId: patchOrder
      summary: Partially update an order (JSON Patch)
      description: >
        Accepts a JSON Patch document (RFC 6902). Currently only the "replace"
        operation on "/status" is supported.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonPatchArray'
            example:
              - op: replace
                path: /status
                value: CONFIRMED
      responses:
        '200':
          description: Order patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: 42
                orderNumber: "ORD-20260910-00042"
                orderDate: "2026-09-10T14:30:00"
                status: CONFIRMED
                totalAmount: 69.97
                customerEmail: "jane.doe@example.com"
                items: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Orders]
      operationId: deleteOrder
      summary: Delete an order
      description: Requires an If-Match header with the current ETag. Returns 412 if the ETag does not match (stale client).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          example: '"v1"'
      responses:
        '204':
          description: Order deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Precondition failed (stale ETag)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Customers ─────────────────────────────────────────────────────
  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers with pagination
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          schema:
            type: string
          example: "fullName,asc"
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCustomerResponse'
              example:
                content:
                  - id: 1
                    email: "jane.doe@example.com"
                    fullName: "Jane Doe"
                    phoneNumber: "+1-555-0123"
                    createdAt: "2026-09-01T10:00:00"
                totalElements: 1
                totalPages: 1
                size: 20
                number: 0

    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a new customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            example:
              email: "jane.doe@example.com"
              fullName: "Jane Doe"
              phoneNumber: "+1-555-0123"
      responses:
        '201':
          description: Customer created
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/customers/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              example:
                id: 1
                email: "jane.doe@example.com"
                fullName: "Jane Doe"
                phoneNumber: "+1-555-0123"
                createdAt: "2026-09-10T14:30:00"
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              example:
                id: 1
                email: "jane.doe@example.com"
                fullName: "Jane Doe"
                phoneNumber: "+1-555-0123"
                createdAt: "2026-09-01T10:00:00"
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Full update of a customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            example:
              email: "jane.m.doe@example.com"
              fullName: "Jane M. Doe"
              phoneNumber: "+1-555-9876"
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              example:
                id: 1
                email: "jane.m.doe@example.com"
                fullName: "Jane M. Doe"
                phoneNumber: "+1-555-9876"
                createdAt: "2026-09-01T10:00:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: Returns 409 if the customer still has associated orders.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Order ID
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Customer ID
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    OrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: integer
          format: int64
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
        orderDate:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
          format: decimal
        customerEmail:
          type: string
          format: email
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal

    OrderStatus:
      type: string
      enum: [PLACED, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]

    CustomerRequest:
      type: object
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phoneNumber:
          type: string
          pattern: '^[0-9+ \-]{0,20}$'

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        phoneNumber:
          type: string
        createdAt:
          type: string
          format: date-time

    JsonPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [replace, add, remove, move, copy, test]
        path:
          type: string
        value:
          description: Value for add/replace operations

    JsonPatchArray:
      type: array
      items:
        $ref: '#/components/schemas/JsonPatchOperation'

    PageOrderResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    PageCustomerResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 400
            error: Bad Request
            message: "Validation failed: items must not be empty"
            path: /api/v1/orders

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 404
            error: Not Found
            message: "Unknown order 999"
            path: /api/v1/orders/999

    Conflict:
      description: Conflict — stock issue or resource constraint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 409
            error: Conflict
            message: "Insufficient stock for product 10"
            path: /api/v1/orders
