openapi: 3.0.3
info:
  title: Cart Service API
  description: Shopping cart management for the e-commerce platform. All operations require JWT authentication.
  version: 1.0.0
  contact:
    name: Platform Team

servers:
  - url: http://localhost:8082
    description: Local development
  - url: http://api-gateway:8080
    description: Via API Gateway

tags:
  - name: Cart
    description: Cart retrieval and clearing
  - name: Cart Items
    description: Add, update, and remove items in the cart

paths:
  /api/v1/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the current user's cart with totals
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
              example:
                id: 42
                items:
                  - id: 1
                    productId: 10
                    productName: "Wireless Mouse"
                    quantity: 2
                    unitPrice: 29.99
                    totalPrice: 59.98
                  - id: 2
                    productId: 25
                    productName: "USB-C Cable"
                    quantity: 3
                    unitPrice: 9.99
                    totalPrice: 29.97
                subtotal: 89.95
                tax: 7.20
                total: 97.15
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Remove all items from the current user's cart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cart/items:
    post:
      tags: [Cart Items]
      operationId: addCartItem
      summary: Add an item to the cart
      description: Adds a product to the cart or increments its quantity if already present. Validates stock availability via Product Service.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            example:
              productId: 10
              quantity: 2
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
              example:
                id: 42
                items:
                  - id: 1
                    productId: 10
                    productName: "Wireless Mouse"
                    quantity: 2
                    unitPrice: 29.99
                    totalPrice: 59.98
                subtotal: 59.98
                tax: 4.80
                total: 64.78
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cart/items/{itemId}:
    put:
      tags: [Cart Items]
      operationId: updateCartItem
      summary: Update the quantity of a cart item
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
            example:
              quantity: 5
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
              example:
                id: 42
                items:
                  - id: 1
                    productId: 10
                    productName: "Wireless Mouse"
                    quantity: 5
                    unitPrice: 29.99
                    totalPrice: 149.95
                subtotal: 149.95
                tax: 12.00
                total: 161.95
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Cart Items]
      operationId: removeCartItem
      summary: Remove an item from the cart
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Item removed, returns updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
              example:
                id: 42
                items: []
                subtotal: 0.00
                tax: 0.00
                total: 0.00
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token required for all cart operations

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Unique identifier of the cart item

  schemas:
    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
          description: ID of the product to add
        quantity:
          type: integer
          minimum: 1
          maximum: 999
          description: Quantity to add

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 999
          description: New quantity for the item

    CartItemDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal

    CartSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Cart ID
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDto'
        subtotal:
          type: number
          format: decimal
          description: Sum of item total prices before tax
        tax:
          type: number
          format: decimal
          description: Calculated tax amount
        total:
          type: number
          format: decimal
          description: Subtotal plus tax

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 400
            error: Bad Request
            message: "Quantity must be at least 1"
            path: /api/v1/cart/items

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 401
            error: Unauthorized
            message: "JWT token is missing or expired"
            path: /api/v1/cart

    NotFound:
      description: Cart item not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 404
            error: Not Found
            message: "Cart item not found"
            path: /api/v1/cart/items/99

    Conflict:
      description: Stock conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 409
            error: Conflict
            message: "Requested quantity exceeds available stock"
            path: /api/v1/cart/items

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-10T14:30:00Z"
            status: 500
            error: Internal Server Error
            message: "An unexpected error occurred"
            path: /api/v1/cart
