groups:
  - name: ecommerce-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'High 5xx error rate on {{ $labels.instance }}'

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le, instance) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High p95 latency on {{ $labels.instance }}'

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Service {{ $labels.job }} is down'

      - alert: HighConnectionUsage
        expr: sum by (instance) (postgresql_connections) / 200 > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL connection usage above 80% on {{ $labels.instance }}'

      - alert: KafkaConsumerLag
        expr: min_over_time(kafka_consumer_lag{group=~".+"}[5m]) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Kafka consumer lag high for consumer group {{ $labels.consumer_group }}'